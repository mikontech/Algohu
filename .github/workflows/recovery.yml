name: Recovery APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/recovery.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore complete sources and apply requested settings
        shell: bash
        run: |
          set -euo pipefail
          BASE=e91d85d76674869ed900c0a5c7d14652f24ad0a6
          D=app/src/main/java/com/example/algohud
          git restore --source="$BASE" -- $D/risk/RiskManager.kt $D/risk/PositionSizer.kt $D/overlay/OverlayService.kt $D/execution/AutoExecutionService.kt $D/execution/ScreenScanner.kt
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/example/algohud/risk/RiskManager.kt')
          s = p.read_text()
          changes = {
              'val maxDailyLossPct: Double = 0.05,': 'val maxDailyLossPct: Double = Double.POSITIVE_INFINITY,',
              'val maxOrdersPerMinute: Int = 3,': 'val maxOrdersPerMinute: Int = Int.MAX_VALUE,',
              'val cooldownAfterLossMs: Long = 10 * 60_000L,': 'val cooldownAfterLossMs: Long = 0L,',
              'fun cooldownLeftMs(): Long = (cooldownAfterLossMs - (clock() - lastLossAt)).coerceAtLeast(0L)': 'fun cooldownLeftMs(): Long = if (config.cooldownAfterLossMs == 0L) 0L else (cooldownAfterLossMs - (clock() - lastLossAt)).coerceAtLeast(0L)',
              'if (now - lastLossAt < cooldownAfterLossMs) {': 'if (config.cooldownAfterLossMs > 0L && now - lastLossAt < cooldownAfterLossMs) {',
              'if (killReason == REASON_DAILY_LOSS) return@withLock false': 'if (config.maxDailyLossPct.isFinite() && killReason == REASON_DAILY_LOSS) return@withLock false'
          }
          for old, new in changes.items():
              if s.count(old) != 1:
                  raise SystemExit('Unexpected source: ' + old)
              s = s.replace(old, new)
          p.write_text(s)
          PY
          mkdir -p recovery-output
          git diff --binary > recovery-output/repair.patch
          git ls-files -z | tar --null -T - -czf recovery-output/recovered-source.tar.gz
      - name: Compile APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee recovery-output/build.log
      - name: Unit tests and lint
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest :app:lintDebug --stacktrace 2>&1 | tee recovery-output/checks.log
      - name: Upload diagnostics and repaired source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-source-and-diagnostics
          path: |
            recovery-output/
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
      - name: Upload APK after successful build and checks
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: algohud-recovery-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
