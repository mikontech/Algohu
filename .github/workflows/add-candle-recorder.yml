name: Add candle recorder
on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-candle-recorder.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: add-candle-recorder
  cancel-in-progress: false
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Patch bot, service and settings screen
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, edits, marker):
              p = Path(path)
              s = p.read_text()
              if marker in s:
                  print('already patched', path)
                  return
              for old, new in edits:
                  if s.count(old) != 1:
                      raise SystemExit('anchor not found in ' + path + ': ' + old[:70])
                  s = s.replace(old, new)
              p.write_text(s)

          patch('app/src/main/java/com/example/algohud/bot/BotOrchestrator.kt', [
              ('lock.withLock { processPrice(t.symbol, t.price, t.timestamp) }',
               'lock.withLock { CandleRecorder.record(t.symbol, t.price, t.timestamp); processPrice(t.symbol, t.price, t.timestamp) }'),
              ('lock.withLock { processPrice(inst, tick.price, tick.timestamp) }',
               'lock.withLock { CandleRecorder.record(if (inst in PYTH_FEEDS) "$inst.BIN" else inst, tick.price, tick.timestamp); processPrice(inst, tick.price, tick.timestamp) }'),
          ], 'CandleRecorder.record')

          patch('app/src/main/java/com/example/algohud/overlay/OverlayService.kt', [
              ('barStore = com.example.algohud.bot.BarStore(filesDir),',
               'barStore = com.example.algohud.bot.BarStore(filesDir).also { com.example.algohud.bot.CandleRecorder.attach(filesDir) },'),
          ], 'CandleRecorder.attach')

          A3 = 'val scroll = ScrollView(this).apply { addView(layout) }'
          UI = (
              'TextView(this).apply { text = "Zapis świec (nauka)"; textSize = 18f }.also { layout.addView(it) }'
              '\n        button("Pokaż zapisane świece") {'
              '\n            android.app.AlertDialog.Builder(this).setTitle("Zapisane świece")'
              '\n                .setMessage(com.example.algohud.bot.CandleRecorder.stats(filesDir))'
              '\n                .setPositiveButton("OK", null).show()'
              '\n        }'
              '\n        '
          )
          patch('app/src/main/java/com/example/algohud/MainActivity.kt', [(A3, UI + A3)], 'CandleRecorder.stats(')
          PY
      - name: Compile (gate before writing to main)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace
      - name: Commit verified change to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "Add candle recorder: continuous 1m/5m candle logging for learning (compiled OK)"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: algohud-recorder-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
