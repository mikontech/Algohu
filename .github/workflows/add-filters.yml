name: Add filters
on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-filters.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: add-filters
  cancel-in-progress: false
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Patch bot and settings screen
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, edits, marker):
              p = Path(path)
              s = p.read_text()
              if marker in s:
                  print('already patched', path)
                  return
              for old, new in edits:
                  if s.count(old) != 1:
                      raise SystemExit('anchor not found in ' + path + ': ' + old[:70])
                  s = s.replace(old, new)
              p.write_text(s)

          A1 = 'sessionBlock(inst, ts)?.let { msg("✋ $inst: $why – pominięte: $it"); return }'
          GUARD = (
              '\n        val bias = prefs.getString("bias", "BOTH") ?: "BOTH"'
              '\n        if ((bias == "LONG" && dir < 0) || (bias == "SHORT" && dir > 0)) {'
              '\n            msg("🧭 $inst: sygnał ${if (dir > 0) "LONG" else "SHORT"} pominięty – wybrany kierunek: $bias")'
              '\n            return'
              '\n        }'
              '\n        MacroWindows.activeReason(ts)?.let { msg("🗓 $inst: $why – pominięte: $it"); return }'
              '\n        SpreadGuard.wideReason(inst)?.let { msg("↔ $inst: $why – pominięte: $it"); return }'
          )
          A2 = 'AutoExecutionService.screenQuote.filterNotNull().collect { q -> guarded("odczyt ekranu") { onScreen(q) } }'
          N2 = 'AutoExecutionService.screenQuote.filterNotNull().collect { q -> guarded("odczyt ekranu") { SpreadGuard.observeQuote(q); onScreen(q) } }'
          patch('app/src/main/java/com/example/algohud/bot/BotOrchestrator.kt', [(A1, A1 + GUARD), (A2, N2)], 'MacroWindows.activeReason')

          A3 = 'val scroll = ScrollView(this).apply { addView(layout) }'
          UI = (
              'TextView(this).apply { text = "Kierunek handlu (filtr sygnałów)"; textSize = 18f }.also { layout.addView(it) }'
              '\n        fun setBias(v: String, label: String) {'
              '\n            getSharedPreferences("instruments", MODE_PRIVATE).edit().putString("bias", v).apply()'
              '\n            Toast.makeText(this, "Kierunek: $label", Toast.LENGTH_SHORT).show()'
              '\n        }'
              '\n        button("Oba kierunki (domyślnie)") { setBias("BOTH", "oba") }'
              '\n        button("Tylko LONG") { setBias("LONG", "tylko LONG") }'
              '\n        button("Tylko SHORT") { setBias("SHORT", "tylko SHORT") }'
              '\n        '
          )
          patch('app/src/main/java/com/example/algohud/MainActivity.kt', [(A3, UI + A3)], 'setBias(')
          PY
      - name: Compile (gate before writing to main)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace
      - name: Commit verified change to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "Add direction filter, macro windows and spread guard (compiled OK)"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: algohud-filters-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
