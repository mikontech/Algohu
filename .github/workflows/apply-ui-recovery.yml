name: Apply and verify UI recovery fix

on:
  push:
    branches: [feature/research-lab]
    paths:
      - scripts/apply-ui-recovery-fix.py
      - app/src/main/java/com/example/algohud/execution/UiActionRecovery.kt
      - app/src/test/java/com/example/algohud/execution/UiActionRecoveryTest.kt
      - .github/workflows/apply-ui-recovery.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/research-lab
          fetch-depth: 0

      - name: Check executor and apply exact patch
        run: python3 scripts/apply-ui-recovery-fix.py

      - name: Commit source integration without force push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/algohud/execution/AutoExecutionService.kt
          git commit -m 'Integrate bounded post-action recovery and block unsafe new entries'
          git push origin HEAD:feature/research-lab

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test patched source
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          chmod +x gradlew
          export GITHUB_SHA="$(git rev-parse HEAD)"
          ./gradlew :app:testDebugUnitTest --stacktrace --console=plain 2>&1 | tee ui-recovery-tests.log

      - name: Compile patched source
        id: build
        continue-on-error: true
        shell: bash
        run: |
          export GITHUB_SHA="$(git rev-parse HEAD)"
          ./gradlew :app:assembleDebug --stacktrace --console=plain 2>&1 | tee ui-recovery-build.log

      - name: Upload test reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-recovery-reports-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ui-recovery-*.log
            app/build/reports/tests/
            app/build/test-results/

      - name: Upload patched APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ui-recovery-debug-apk-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: app/build/outputs/apk/debug/*.apk

      - name: Enforce verification result
        if: always()
        env:
          TESTS: ${{ steps.tests.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          echo "Tests: $TESTS; build: $BUILD" >> "$GITHUB_STEP_SUMMARY"
          test "$TESTS" = success && test "$BUILD" = success
