name: Patch HUD messages
on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-hud-messages.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: patch-hud-messages
  cancel-in-progress: false
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Patch RT messages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/example/algohud/bot/BotOrchestrator.kt')
          s = p.read_text()
          scr = 'inst == AutoExecutionService.screenQuote.value?.instrument'
          changes = {
              'if (rtNotes.add(key)) msg("$head – pominięta: $why")': 'if (rtNotes.add(key) && ' + scr + ') msg("$head – pominięta: $why")',
              'msg("$head – WCHODZĘ")': 'if (' + scr + ') msg("$head – WCHODZĘ")'
          }
          for old, new in changes.items():
              if s.count(old) != 1:
                  raise SystemExit('Unexpected source: ' + old)
              s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Compile (gate before writing to main)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace
      - name: Commit verified change to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "HUD: show RT messages only for the instrument open in XTB (compiled OK)"
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: algohud-hudfix-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
